version: '3.8'

# XCodeReviewer Docker Compose 配置
# 适用于生产环境 - 连接外部 PostgreSQL 和 Redis

services:
  # ==========================================
  # 前端服务
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 从环境变量或 .env 文件读取构建参数
        # 注意: LLM API Keys 已移除，现在由后端统一管理
        # 注意: 本地数据库模式已移除，始终使用后端 API
        - VITE_API_BASE_URL=/api/v1
        - VITE_GITHUB_TOKEN=${VITE_GITHUB_TOKEN}
        - VITE_APP_ID=${VITE_APP_ID:-xcodereviewer}
        - VITE_MAX_ANALYZE_FILES=${VITE_MAX_ANALYZE_FILES:-40}
        - VITE_LLM_CONCURRENCY=${VITE_LLM_CONCURRENCY:-2}
        - VITE_LLM_GAP_MS=${VITE_LLM_GAP_MS:-500}
        - VITE_OUTPUT_LANGUAGE=${VITE_OUTPUT_LANGUAGE:-zh-CN}
    container_name: xcodereviewer-frontend
    ports:
      - "80:80"  # 前端通过 80 端口访问
    networks:
      - xcodereviewer-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.xcodereviewer.service=frontend"
      - "com.xcodereviewer.description=前端 Web 应用"

  # ==========================================
  # 后端 API 服务
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xcodereviewer-backend
    ports:
      - "8000:8000"  # 后端 API 端口
    env_file:
      - ./backend/.env  # 从 backend/.env 读取环境变量(包括外部 PostgreSQL 和 Redis 配置)
    environment:
      # MinIO 配置(Docker Compose 内部服务)
      - MINIO_ENDPOINT=minio:9000
      - MINIO_SECURE=false
      # Python 路径
      - PYTHONPATH=/app
      # 应用环境
      - APP_ENV=production
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/storage:/app/storage
      - ./backend/uploads:/app/uploads
    networks:
      - xcodereviewer-network
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      - "com.xcodereviewer.service=backend"
      - "com.xcodereviewer.description=后端 API 服务"

  # ==========================================
  # MinIO 对象存储服务
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: xcodereviewer-minio
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - xcodereviewer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.xcodereviewer.service=minio"
      - "com.xcodereviewer.description=对象存储服务"

  # ==========================================
  # Celery Worker 服务
  # ==========================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xcodereviewer-celery-worker
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    env_file:
      - ./backend/.env
    environment:
      # Celery 配置
      - CELERY_WORKER=1
      # MinIO 配置
      - MINIO_ENDPOINT=minio:9000
      - MINIO_SECURE=false
      # Python 路径
      - PYTHONPATH=/app
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/storage:/app/storage
      - ./backend/uploads:/app/uploads
    networks:
      - xcodereviewer-network
    depends_on:
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "com.xcodereviewer.service=celery-worker"
      - "com.xcodereviewer.description=异步任务处理器"

  # ==========================================
  # Celery Beat 调度服务
  # ==========================================
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xcodereviewer-celery-beat
    command: celery -A tasks.celery_app beat --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      # Python 路径
      - PYTHONPATH=/app
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - xcodereviewer-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    labels:
      - "com.xcodereviewer.service=celery-beat"
      - "com.xcodereviewer.description=定时任务调度器"

  # ==========================================
  # Flower 监控服务
  # ==========================================
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xcodereviewer-flower
    command: celery -A tasks.celery_app flower --port=5555 --basic_auth=admin:admin
    ports:
      - "5555:5555"  # Flower Web UI
    env_file:
      - ./backend/.env
    environment:
      # Python 路径
      - PYTHONPATH=/app
    networks:
      - xcodereviewer-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    labels:
      - "com.xcodereviewer.service=flower"
      - "com.xcodereviewer.description=Celery 任务监控"

# ==========================================
# 网络配置
# ==========================================
networks:
  xcodereviewer-network:
    driver: bridge
    name: xcodereviewer_network
    labels:
      - "com.xcodereviewer.network=main"

# ==========================================
# 数据卷配置
# ==========================================
volumes:
  # MinIO 对象存储数据
  minio_data:
    driver: local
    labels:
      - "com.xcodereviewer.volume=minio"

